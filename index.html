  if(r&&r.v===1) REC={ v:1, done:obj(r.done), fav:obj(r.fav), read:obj(r.read), recent:Array.isArray(r.recent)?r.recent.filter(x=>x&&typeof x.key==='string'):[], last:(r.last&&typeof r.last.key==='string')?r.last:null };
}catch(e){}
function saveRec(){ try{ localStorage.setItem('hltb.records', JSON.stringify(REC)); }catch(e){} }
const now=()=>new Date().toISOString().slice(0,10);
function mark(kind,key,on){ const e=BYKEY[key]; if(!e) return; if(on) REC[kind][key]={title:e.title,t:now()}; else delete REC[kind][key]; saveRec(); }
function touch(key){ const e=BYKEY[key]; if(!e) return; REC.recent=REC.recent.filter(r=>r.key!==key); REC.recent.unshift({key,title:e.title,t:now()}); REC.recent=REC.recent.slice(0,60); saveRec(); }
// 上游可能插条、改序、改标题。记录里存着标题快照：位置对不上时，在同一节里按标题找回来；找不到就标 lost，不硬配。
function lcs(a,b){ const dp=new Array(b.length+1).fill(0); for(let i=1;i<=a.length;i++){ let prev=0; for(let j=1;j<=b.length;j++){ const tmp=dp[j]; dp[j]= a[i-1]===b[j-1] ? prev+1 : Math.max(dp[j],dp[j-1]); prev=tmp; } } return dp[b.length]; }
const norm=t=>String(t||'').replace(/[\s\p{P}\p{S}\d]/gu,'');
function resolve(key,title){
  if(typeof key!=='string') return null;
  const e=BYKEY[key]; if(e && (!title || e.title===title)) return key;
  if(!title) return null;
  const sn=+key.split('-')[0]; const s=BOOK.find(x=>x.n===sn); if(!s) return null;
  const ex=s.entries.find(c=>c.title===title); if(ex) return `${sn}-${ex.n}`;
  const t=norm(title); let best=null,b1=0,b2=0;
  for(const c of s.entries){ const ct=norm(c.title), m=Math.min(ct.length,t.length); if(!m) continue; const l=lcs(ct,t); const sc = l>=Math.max(6,Math.ceil(0.7*m)) ? l/m : 0; if(sc>b1){ b2=b1; b1=sc; best=c; } else if(sc>b2) b2=sc; }
  return best && b1-b2>=0.2 ? `${sn}-${best.n}` : null;
}
function migrate(){
  let changed=false;
  for(const kind of ['done','fav','read']){ const out={};
    for(const [k,v] of Object.entries(REC[kind])){ const k0=v.lost?(v.key0||k.replace(/^lost:/,'')):k; const nk=resolve(k0,v.title);
      if(nk){ if(!out[nk] || (v.t||'')>(out[nk].t||'')) out[nk]={title:BYKEY[nk].title,orig:v.orig||v.title,t:v.t}; if(nk!==k||v.title!==BYKEY[nk].title||v.lost) changed=true; }
      else { const lk='lost:'+k0; if(!out[lk]) out[lk]=Object.assign({},v,{lost:true,key0:k0}); if(lk!==k) changed=true; } }
    REC[kind]=out; }
  const seen=new Set(), nr=[];
  for(const r of REC.recent){ const nk=resolve(r.lost?(r.key0||r.key):r.key,r.title); const x= nk ? {key:nk,title:BYKEY[nk].title,t:r.t} : Object.assign({},r,{lost:true,key0:r.key0||r.key}); if(nk&&(nk!==r.key||r.title!==x.title||r.lost)) changed=true; if(!nk&&!r.lost) changed=true; nr.push(x); }
  nr.sort((a,b)=>(b.t||'').localeCompare(a.t||''));
  REC.recent=nr.filter(r=>{ if(r.lost) return true; if(seen.has(r.key)){ changed=true; return false; } seen.add(r.key); return true; });
  if(REC.last){ const nk=resolve(REC.last.key,REC.last.title); const nl = nk ? Object.assign({},REC.last,{key:nk,title:BYKEY[nk].title}) : null; if(JSON.stringify(nl)!==JSON.stringify(REC.last)) changed=true; REC.last=nl; }
  if(changed) saveRec();
}

function hrefOf(u, base){ // 长文和正文里指向仓库文件的相对链接改成站内地址

const LAW_CTX=/(?:》|号|解释|意见|规定|条例|办法|[^援]法)\s?[，,]?\s?$/;
// 正文里的标记：**粗体**、<url>、[文字](url)、裸 url、`代码`，以及「见第 X 节第 Y 条」「第 Y 条」的互相指路。secN=0 表示长文。
function rich(s, secN, q){

  h=h.replace(/&lt;(https?:(?:(?!&gt;)\S)+?)&gt;/g,(m,u)=>`<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
  h=h.replace(/(^|[^"=>\w])(https?:\/\/(?:(?!&gt;|&lt;)[^\s<）)，。；、])+)/g,(m,p,u)=>`${p}<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
  h=h.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  h=h.replace(/`([^`]+)`/g,'<code>$1</code>');
  h=h.replace(/第\s?(\d+)\s?节第\s?(\d+)\s?条/g,(m,a,b)=>BYKEY[`${a}-${b}`]?`<a class="xref" href="#s${a}-${b}">${m}</a>`:m);
  if(secN) h=h.replace(/(^|[^节\d])第\s?(\d+)\s?条(?!<\/a>)/g,(m,p,b,off,str)=>(LAW_CTX.test(str.slice(Math.max(0,off-10),off+p.length)) || !BYKEY[`${secN}-${b}`]) ? m : `${p}<a class="xref" href="#s${secN}-${b}">第 ${b} 条</a>`);

}

function md(src){
  const lines=src.split('\n'); const out=[]; let i=0;
  const inl=s=>rich(s,0);
  while(i<lines.length){
    const l=lines[i];
    if(!l.trim()){ i++; continue; }
    if(/^# /.test(l)){ i++; continue; }
    let m;
    if((m=/^(#{2,4}) (.*)$/.exec(l))){ const lv=m[1].length; out.push(`<h${lv}>${inl(m[2])}</h${lv}>`); i++; continue; }

    if(/^\d+\. /.test(l)){ const items=[]; while(i<lines.length&&/^\d+\. /.test(lines[i])){ items.push(lines[i].replace(/^\d+\. /,'')); i++; } out.push(`<ol>${items.map(x=>`<li>${inl(x)}</li>`).join('')}</ol>`); continue; }
    if(/^[-*] /.test(l)){ const items=[]; while(i<lines.length&&/^[-*] /.test(lines[i])){ items.push(lines[i].replace(/^[-*] /,'')); i++; } out.push(`<ul>${items.map(x=>`<li>${inl(x)}</li>`).join('')}</ul>`); continue; }

}

function importJSON(text){
  let d; try{ d=JSON.parse(text); }catch(e){ return '不是有效的 JSON'; }
  if(!d||d.v!==1||typeof d.done!=='object'||!d.done) return '不是本站导出的记录文件';
  if(d.recent!=null && !Array.isArray(d.recent)) return '文件格式不对';
  const str=x=>typeof x==='string'?x:'';
  const bak=JSON.stringify(REC);
  try{
    let n=0, miss=0;
    for(const kind of ['done','fav','read']){ const src=d[kind]; if(!src||typeof src!=='object') continue;
      for(const [k,v] of Object.entries(src)){ if(/^lost:/.test(k)) continue; const nk=resolve(k, v&&str(v.title)); if(!nk){ miss++; continue; } if(!REC[kind][nk]){ REC[kind][nk]={title:BYKEY[nk].title,t:(v&&str(v.t))||now()}; n++; } } }

    saveRec(); return `已合并 ${n} 条${miss?`，${miss} 条在当前正文里找不到对应条目，已跳过`:''}`;
  }catch(e){ try{ REC=JSON.parse(bak); }catch(e2){} return '文件内容有问题，没有导入'; }
}

qInput.addEventListener('keydown',ev=>{ if(ev.key==='Enter'&&!ev.isComposing&&ev.keyCode!==229){ ev.preventDefault(); qInput.blur(); } });
document.addEventListener('keydown',ev=>{ if(ev.key==='/'&&document.activeElement!==qInput&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){ ev.preventDefault(); qInput.focus(); } if(ev.key==='Escape'){ if(pop){ closePop(); return; } if(document.activeElement===qInput){ qInput.value=''; state.q=''; route(); qInput.blur(); } } });
window.addEventListener('hashchange',()=>{ if(state.q){ state.q=''; qInput.value=''; } route(); });
document.addEventListener('click',ev=>{ const a=ev.target.closest('a[href^="#"]'); if(a && state.q && a.getAttribute('href')===(location.hash||'#home')){ state.q=''; qInput.value=''; route(); } });
$('#back').addEventListener('click',()=>{ if(history.length>1) history.back(); else location.hash='#home'; });

/* ---------- 载入 ---------- */
function fail(err){ main.innerHTML=`<p class="empty">无法读取正文数据（${esc(err&&err.message||err)}）。<button type="button" id="reload">点这里重新加载</button>　若是直接双击打开的本地文件，需改用 http 方式访问。</p>`; $('#reload').addEventListener('click',()=>location.reload()); window.addEventListener('online',()=>location.reload(),{once:true}); }
Promise.all([
  fetch('book.json',{cache:'no-cache'}).then(r=>{ if(!r.ok) throw new Error('book.json '+r.status); return r.json(); }),
  fetch('docs.json',{cache:'no-cache'}).then(r=>r.ok?r.json():[]).catch(()=>[]),
]).then(([data,docs])=>{
  BOOK=data.sections; META=data.meta||{}; DOCS=Array.isArray(docs)?docs:[];
  for(const s of BOOK) for(const e of s.entries){ e.key=`${s.n}-${e.n}`; BYKEY[e.key]=e; }
  ALL=BOOK.flatMap(s=>s.entries);
  if(META.sha) $('#stamp').textContent=`${META.sha}（${META.date}）`;
  try{ migrate(); }catch(e){ REC=EMPTY(); }
  route();
}).catch(fail);
})();
</script>
